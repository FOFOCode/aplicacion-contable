# =============================================================================
# DOCKER COMPOSE - SISTEMA CONTABLE AUTOMATIZADO
# Levanta la Base de Datos PostgreSQL y el Frontend Next.js con un solo comando
# =============================================================================

services:
  # 1. Base de Datos Relacional PostgreSQL 16 (Local - Opcional)
  # Solo se levanta si se especifica: docker compose --profile local-db up -d
  db:
    image: postgres:16-alpine
    container_name: modulo-contable-db
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: contabilidad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contabilidad"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contable-net

  # 2. Aplicación Web Frontend (Next.js 16) - Conectada a Supabase mediante .env
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modulo-contable-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - contable-net

volumes:
  postgres_data:
    driver: local

networks:
  contable-net:
    driver: bridge
